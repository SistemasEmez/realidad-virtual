<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;height:100vh;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
    body:before{content:'';position:absolute;inset:40% -50% -65%;background-image:linear-gradient(#ada0c026 1px,transparent 1px),linear-gradient(90deg,#ada0c026 1px,transparent 1px);background-size:35px 35px;transform:perspective(400px) rotateX(55deg);pointer-events:none}
    model-viewer{width:100%;height:100%;--progress-bar-color:#a28bc8;position:relative;visibility:hidden}
    #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#78638f;font-size:14px;line-height:1.7;background:#f5effb66}
    #status[hidden]{display:none}
    #status.is-error{color:#92566c}
  </style>
</head>
<body>
  <model-viewer id="model" alt="Modelo 3D de la experiencia" camera-controls shadow-intensity="1" exposure="1.1" camera-orbit="30deg 75deg auto" interaction-prompt="none" environment-image="neutral"></model-viewer>
  <p id="status" role="status">Preparando el visor 3D…</p>
  <script src="/preview-controller.js"></script>
</body>
</html>
