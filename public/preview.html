<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:transparent;font-family:Arial,sans-serif}body:before{content:'';position:absolute;inset:40% -50% -65%;background-image:linear-gradient(#ada0c026 1px,transparent 1px),linear-gradient(90deg,#ada0c026 1px,transparent 1px);background-size:35px 35px;transform:perspective(400px) rotateX(55deg);pointer-events:none}model-viewer{width:100%;height:100%;--progress-bar-color:#a28bc8;position:relative}#error{position:absolute;top:40%;left:10%;right:10%;text-align:center;color:#9b87b1;font-size:12px;display:none}</style></head><body><model-viewer id="model" src="/original/Logo1.glb" alt="Logo 3D de la experiencia" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" camera-orbit="30deg 75deg auto" interaction-prompt="none" environment-image="neutral"></model-viewer><p id="error"></p><script>const m=document.getElementById('model');const error=document.getElementById('error');let current='';addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data.type==='reset'){m.cameraOrbit='30deg 75deg auto';m.jumpCameraToGoal();return}if(e.data.type!=='config')return;const c=e.data.config;if(c.model!==current){current=c.model;m.src=c.model;error.style.display='none'}const ratio=c.scale/1000;m.scale=[ratio,ratio,ratio].join(' ');m.orientation=c.rz+'deg '+c.ry+'deg '+c.rx+'deg';m.autoRotate=c.spin;});m.addEventListener('error',()=>{error.textContent='No se pudo abrir el modelo. Comprueba que el GLB incluya sus texturas y sea válido.';error.style.display='block'});setTimeout(()=>{if(!customElements.get('model-viewer')){error.textContent='El visor 3D necesita conexión a internet. Recarga cuando tengas conexión.';error.style.display='block'}},15000);parent.postMessage({type:'ready'},location.origin);</script></body></html>
