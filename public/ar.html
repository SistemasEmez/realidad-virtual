<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#15121b;color:#fff}.overlay{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:10;background:#201a32dd;border:1px solid #ffffff33;border-radius:12px;padding:16px 24px;max-width:80vw;text-align:center;font-size:13px;line-height:1.6}#brand{position:fixed;left:22px;top:20px;z-index:15;display:flex;align-items:center;gap:10px;font-size:16px}#brand img{height:40px;width:70px;object-fit:contain}a-scene{position:absolute;inset:0}</style></head><body><div id="brand">◈ Órbita</div><div class="overlay" id="status" role="status">Preparando la cámara…</div><script>
let started=false;const status=document.getElementById('status');const show=s=>status.textContent=s;
addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent||e.data.type!=='start'||started)return;started=true;const c=e.data.config;try{
if(!window.AFRAME||!AFRAME.components['mindar-image'])throw Error('No se pudo cargar MindAR. Revisa tu conexión y vuelve a intentarlo.');
if(c.brandLogo){const brand=document.getElementById('brand');brand.textContent='';const image=document.createElement('img');image.src=c.brandLogo;image.alt='Tu marca';brand.append(image)}
const scene=document.createElement('a-scene');scene.setAttribute('mindar-image','imageTargetSrc: '+c.target+'; autoStart: false; uiScanning: false; uiLoading: false;');scene.setAttribute('color-space','sRGB');scene.setAttribute('renderer','colorManagement: true; physicallyCorrectLights: true');scene.setAttribute('vr-mode-ui','enabled: false');scene.setAttribute('device-orientation-permission-ui','enabled: false');
const camera=document.createElement('a-camera');camera.setAttribute('position','0 0 0');camera.setAttribute('look-controls','enabled: false');scene.append(camera);
const anchor=document.createElement('a-entity');anchor.setAttribute('mindar-image-target','targetIndex: '+c.targetIndex);anchor.addEventListener('targetFound',()=>show('Target detectado · Tu experiencia está activa'));anchor.addEventListener('targetLost',()=>show('Apunta de nuevo a tu imagen target'));
const model=document.createElement('a-gltf-model');model.setAttribute('src',c.model);model.setAttribute('scale',[c.scale,c.scale,c.scale].join(' '));model.setAttribute('rotation',[c.rx,c.ry,c.rz].join(' '));model.setAttribute('position',[c.x,c.y,c.z].join(' '));if(c.spin)model.setAttribute('animation','property: rotation; from: '+[c.rx,c.ry,c.rz].join(' ')+'; to: '+[c.rx,c.ry+360,c.rz].join(' ')+'; dur: 12000; easing: linear; loop: true');
model.addEventListener('model-error',()=>show('No se pudo cargar el GLB. Cierra la cámara y revisa el archivo.'));anchor.append(model);scene.append(anchor);
scene.addEventListener('arError',()=>show('No se pudo iniciar la cámara. Permite el acceso y usa HTTPS.'));scene.addEventListener('arReady',()=>show('Apunta a la imagen original de tu target'));
scene.addEventListener('loaded',async()=>{try{await scene.systems['mindar-image-system'].start()}catch(err){show('No se pudo iniciar AR. Verifica permisos de cámara y que el archivo .mind sea válido.')}});document.body.append(scene);
}catch(err){show(err.message)}});
</script></body></html>
